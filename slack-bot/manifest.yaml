# Slack app manifest for the QA bot.
#
# Create the app from this file instead of clicking through the UI:
#   https://api.slack.com/apps  ->  Create New App  ->  From a manifest
#
# Replace REPLACE_WITH_WORKER_URL with the URL `wrangler deploy` prints,
# then reinstall the app so the slash command picks it up.
display_information:
  name: QA Agent
  description: Run and report the Sauce Demo storefront Playwright suite
  background_color: '#2d2d2d'

features:
  bot_user:
    display_name: QA Agent
    always_online: false
  slash_commands:
    - command: /qa
      url: REPLACE_WITH_WORKER_URL
      description: Run the QA suite
      usage_hint: '[smoke|regression|anomaly|data|all] [workers]'
      should_escape: false

oauth_config:
  scopes:
    bot:
      # chat:write      — post run results
      # chat:write.public — post into channels the bot has not been invited to
      # commands        — receive /qa
      - chat:write
      - chat:write.public
      - commands

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
