# Slack app manifest for the QA bot.
#
# Socket Mode is enabled, so the app connects out to Slack over a WebSocket
# and needs no public URL — which is why the slash command below has no
# `url`. That is what makes it runnable from a laptop.
#
# Create the app from this file rather than clicking through the UI:
#   https://api.slack.com/apps  ->  Create New App  ->  From a manifest
display_information:
  name: QA Agent
  description: Run and report the Sauce Demo storefront Playwright suite
  background_color: '#2d2d2d'

features:
  bot_user:
    display_name: QA Agent
    always_online: false
  slash_commands:
    - command: /qa
      description: Run the QA suite
      usage_hint: '[smoke|regression|anomaly|data|all] [workers]'
      should_escape: false

oauth_config:
  scopes:
    bot:
      # chat:write        — post run results and the start acknowledgement
      # chat:write.public — post into channels the bot was not invited to
      # commands          — receive /qa
      # channels:read     — resolve a channel name to its id, and check the
      #                     bot's membership. Read-only on public channel
      #                     metadata; it does not grant message history.
      - chat:write
      - chat:write.public
      - commands
      - channels:read

settings:
  org_deploy_enabled: false
  # Outbound WebSocket instead of inbound HTTP. No tunnel, no signature
  # verification, no hosting.
  socket_mode_enabled: true
  token_rotation_enabled: false
